name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests (installer, router, monitor, panel)
        shell: bash
        run: |
          python plugins/agy-delegate/scripts/test_agyctl.py
          python plugins/agy-delegate/skills/agy-delegate/scripts/test_router.py
          python test_monitor.py
          python test_panel.py
      - name: Wrapper tests (bash, fake agy)
        if: runner.os != 'Windows'
        run: bash plugins/agy-delegate/skills/agy-delegate/scripts/test_wrapper.sh
      - name: Wrapper tests (Windows PowerShell 5.1, fake agy)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File plugins/agy-delegate/skills/agy-delegate/scripts/test_wrapper.ps1
      - name: Wrapper tests (Git Bash on Windows, fake agy)
        if: runner.os == 'Windows'
        shell: bash
        run: bash plugins/agy-delegate/skills/agy-delegate/scripts/test_wrapper.sh
      - name: Installers round-trip (temporary home, no network)
        shell: bash
        run: bash tests/test_installers.sh
      - name: Installers round-trip (PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installers.ps1
      - name: Shell syntax
        if: runner.os != 'Windows'
        run: for f in install.sh toggle.sh open-panel.sh plugins/agy-delegate/scripts/setup.sh plugins/agy-delegate/skills/agy-delegate/scripts/*.sh; do bash -n "$f"; done
  build:
    name: package (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r packaging/requirements.txt
      - name: Build and self-test the desktop app
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            dist/agy-delegate-windows-x64.exe
            dist/agy-delegate-macos.zip
            dist/*.sha256
          if-no-files-found: error
