<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model usage monitor</title>
<style>
:root{--fg:#fff;--mut:rgba(255,255,255,.62);--glass:rgba(255,255,255,.14);--edge:rgba(255,255,255,.38);--edge2:rgba(255,255,255,.06);
 --ok:#32d74b;--idle:rgba(255,255,255,.4);--b1:#4f7cff;--b2:#b36bff;--shadow:0 18px 50px rgba(10,10,40,.35)}
@media(prefers-color-scheme:light){:root{--fg:#101322;--mut:rgba(16,19,34,.6);--glass:rgba(255,255,255,.42);--edge:rgba(255,255,255,.9);--edge2:rgba(255,255,255,.35);--idle:rgba(16,19,34,.35);--shadow:0 18px 50px rgba(60,70,140,.25)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px;color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
 background:radial-gradient(60% 50% at 15% 10%,#5b8cff 0,transparent 60%),radial-gradient(50% 45% at 90% 20%,#c06bff 0,transparent 60%),
 radial-gradient(60% 60% at 70% 95%,#ff7aa8 0,transparent 60%),radial-gradient(50% 50% at 5% 90%,#2fd6c4 0,transparent 60%),#10142b;background-attachment:fixed}
@media(prefers-color-scheme:light){body{background-color:#e8ecff}}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:14px}
h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 6px}
.card{position:relative;padding:16px 18px;border-radius:28px;background:var(--glass);
 -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
 border:1px solid var(--edge2);box-shadow:var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 var(--edge2),inset 0 0 22px rgba(255,255,255,.07)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.12))}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;position:relative}
.mut{color:var(--mut);font-size:12px;position:relative}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;font-size:12px;color:var(--mut);
 background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 var(--edge2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.on .pill{color:var(--fg)}.on .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(50,215,75,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(50,215,75,0)}100%{box-shadow:0 0 0 0 rgba(50,215,75,0)}}
@media(prefers-reduced-motion:reduce){.on .dot{animation:none}}
.title{font-weight:600;font-size:16px}
.models{margin-top:10px;position:relative}
.bar{height:7px;border-radius:99px;margin:5px 0 7px;background:linear-gradient(90deg,var(--b1),var(--b2));box-shadow:0 0 12px rgba(120,130,255,.55);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.foot{font-size:11px;color:var(--mut);margin:0 8px;text-align:center}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card{background:rgba(40,46,90,.85)}}
</style></head><body><div class="wrap">
<h1>Model usage · last 24 h</h1>
<div class="card"><div class="row" id="c_state"><span class="title">Claude Code</span><span class="pill"><span class="dot"></span><span id="c_txt">…</span></span></div>
<div class="models" id="c_models"></div></div>
<div class="card"><div class="row" id="a_state"><span class="title">agy helper</span><span class="pill"><span class="dot"></span><span id="a_txt">…</span></span></div>
<div class="models" id="a_models"></div></div>
<div class="foot" id="foot"></div></div>
<script>
const n=x=>x>=1e6?(x/1e6).toFixed(2)+"M":x>=1e3?(x/1e3).toFixed(1)+"k":String(x);
function rows(el,items,max){el.innerHTML=items.map(([k,main,sub,v])=>`<div class="row"><span>${k}</span><span>${main}</span></div><div class="bar" style="width:${max?Math.max(2,100*v/max):0}%"></div><div class="mut">${sub}</div>`).join("")||'<div class="mut">no activity</div>'}
async function tick(){try{const d=await (await fetch("/api/stats")).json();
 const cm=Object.entries(d.claude).map(([m,[i,o,cr,cw,k]])=>[m,n(i+o+cr+cw)+" tok",`in ${n(i)} · out ${n(o)} · cache r ${n(cr)} / w ${n(cw)} · ${k} msgs`,i+o+cr+cw]);
 rows(c_models,cm,Math.max(1,...cm.map(r=>r[3])));
 c_state.className="row"+(d.claude_active?" on":"");c_txt.textContent=d.claude_active?"operating":(d.claude_last_s==null?"no sessions":"idle "+Math.round(d.claude_last_s/60)+" min");
 const am=Object.entries(d.agy).map(([m,r])=>[m,r.calls+" calls",`${r.ok} ok · ${r.denied} denied · out ${n(r.out_bytes)} B · ${Math.round(r.dur_s)} s`,r.calls]);
 rows(a_models,am,Math.max(1,...am.map(r=>r[3])));
 const run=d.agy_running.length;a_state.className="row"+(run?" on":"");a_txt.textContent=run?`operating (${run} running, ${Math.round(d.agy_running[0].age_s)} s)`:"idle";
 foot.textContent="updated "+new Date(d.now*1000).toLocaleTimeString()+" · Claude tokens from local transcripts; agy size in bytes (agy reports no tokens)";
}catch(e){foot.textContent="monitor offline"}}
tick();setInterval(tick,3000);
</script></body></html>
